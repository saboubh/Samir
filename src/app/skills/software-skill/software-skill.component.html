<section class="software-skills-main-div" aria-labelledby="expertise-ecosystem-title">
  <header class="icon-panel-header">
    <p>{{ 'skillsSection.iconPanel.eyebrow' | translate }}</p>
    <h2 id="expertise-ecosystem-title">{{ 'skillsSection.iconPanel.title' | translate }}</h2>
  </header>

  <ul class="dev-icons">
    <li
      class="software-skill-inline"
      *ngFor="let skill of skillsSection.softwareSkills"
      [ngClass]="'skill-tone-' + skill.tone"
    >
      <span class="skill-icon-shell" aria-hidden="true">
        <i [ngClass]="skill.fontAwesomeClassname"></i>
      </span>
      <p>{{ skill.labelKey | translate }}</p>
    </li>
  </ul>
</section>
