<div class="social-media-div">
  <button type="button" class="icon-button icon-button-disabled github" aria-label="GitHub" disabled>
    <i class="fa fa-github" aria-hidden="true"></i>
    <span></span>
  </button>
  <button type="button" class="icon-button icon-button-disabled linkedin" aria-label="LinkedIn" disabled>
    <i class="fa fa-linkedin" aria-hidden="true"></i>
    <span></span>
  </button>
  <a [href]="'mailto:' + socialMediaLinks.gmail" class="icon-button google" aria-label="Email">
    <i class="fa fa-envelope" aria-hidden="true"></i>
    <span></span>
  </a>
  <button type="button" class="icon-button icon-button-disabled instagram" aria-label="Instagram" disabled>
    <i class="fa fa-instagram" aria-hidden="true"></i>
    <span></span>
  </button>
  <button type="button" class="icon-button icon-button-disabled facebook" aria-label="Facebook" disabled>
    <i class="fa fa-facebook" aria-hidden="true"></i>
    <span></span>
  </button>
</div>
